<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDevil To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 CyberDevil To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <main>
            <!-- Input Section -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..." 
                    class="todo-input"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Todo List -->
            <div class="todo-section">
                <ul id="todoList" class="todo-list"></ul>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat">
                    <span class="stat-label">Total:</span>
                    <span id="totalCount" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Completed:</span>
                    <span id="completedCount" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Remaining:</span>
                    <span id="remainingCount" class="stat-value">0</span>
                </div>
            </div>

            <!-- Clear Completed Button -->
            <div class="action-section">
                <button id="clearBtn" class="clear-btn">Clear Completed Tasks</button>
                <button id="clearAllBtn" class="clear-all-btn">Clear All Tasks</button>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 CyberDevil. Stay focused, stay productive.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
